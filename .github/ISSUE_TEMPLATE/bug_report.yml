name: Bug report
description: Something in OpenSuperCAD behaves incorrectly.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, plus a minimal .scad file if relevant.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenSuperCAD version, OS and OpenSCAD version
      placeholder: "v0.1.3, Arch Linux (Wayland), OpenSCAD 2021.01"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent (if relevant)
      placeholder: "Claude Code via @zed-industries/claude-code-acp"
