# Reports clippy findings to the Security tab (code scanning) as SARIF. This is
# informational and non-blocking — the hard `clippy -D warnings` gate lives in
# ci.yml. Uses dtolnay/rust-toolchain (the actions-rs actions are archived).
name: rust-clippy analyze

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "19 18 * * 0"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: clippy-sarif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-clippy-analyze:
    name: clippy-sarif
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install clippy-sarif
        env:
          # renovate: datasource=crate depName=clippy-sarif
          CLIPPY_SARIF_VERSION: 0.8.0
          # renovate: datasource=crate depName=sarif-fmt
          SARIF_FMT_VERSION: 0.8.0
        run: |
          cargo install clippy-sarif --version "$CLIPPY_SARIF_VERSION" --locked
          cargo install sarif-fmt --version "$SARIF_FMT_VERSION" --locked
      - name: Run clippy (SARIF)
        run: |
          cargo clippy --workspace --exclude opensupercad --all-targets --message-format=json \
            | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true
