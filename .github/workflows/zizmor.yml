# Static analysis of our own GitHub Actions with zizmor (supply-chain / CI
# hardening: credential persistence, cache poisoning, excessive permissions,
# template injection, unpinned actions). Reports to the Security tab as SARIF —
# informational and non-blocking, mirroring the trivy/clippy scans.
name: zizmor

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/**"]
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/**"]
  schedule:
    - cron: "27 6 * * 1"

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the SARIF report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run zizmor
        env:
          # Enables online audits (stale pins, etc.); the token is read-only.
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor --format sarif .github/workflows/ > zizmor.sarif
        continue-on-error: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor
