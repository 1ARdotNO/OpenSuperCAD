[package]
name = "opensupercad"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

description = "OpenSuperCAD: an AI-powered, native editor for OpenSCAD"

[[bin]]
name = "opensupercad"
path = "src/main.rs"

[dependencies]
osc-syntax.workspace = true
osc-engine.workspace = true
osc-project.workspace = true
osc-git.workspace = true
osc-agent.workspace = true
osc-mcp.workspace = true
osc-update.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
async-channel = "2.5.0"
base64 = "0.23.1"
dirs = "7.0.0"
gpui-kit = { version = "0.7.0", features = ["tree-sitter", "tree-sitter-diff"] }
# Only for `image::Frame`, which GPUI's `RenderImage` is built from; no codecs.
image = { version = "0.25.10", default-features = false }
tree-sitter-openscad-ng = "0.7.1"

[build-dependencies]
winresource = "0.1.31"

[lints]
workspace = true

[package.metadata.deb]
name = "opensupercad"
maintainer = "OpenSuperCAD contributors"
copyright = "OpenSuperCAD contributors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
An AI-powered, native editor for OpenSCAD. Drive parametric CAD designs \
with any Agent Client Protocol agent; a built-in MCP server lets the agent \
render, look at snapshots from any angle and checkpoint every iteration in git."""
section = "graphics"
priority = "optional"
depends = "$auto, git, libvulkan1"
# libegl1 & co. are what the official OpenSCAD AppImage the app can download
# expects from the system.
recommends = "openscad, mesa-vulkan-drivers, libegl1, libgl1, libopengl0, libgbm1"
suggests = "xvfb, nodejs"
assets = [
  ["target/release/opensupercad", "usr/bin/", "755"],
  ["target/release/opensupercad-mcp", "usr/bin/", "755"],
  ["../../packaging/linux/opensupercad.desktop", "usr/share/applications/", "644"],
  ["../../packaging/linux/opensupercad.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["../../README.md", "usr/share/doc/opensupercad/README.md", "644"],
]
