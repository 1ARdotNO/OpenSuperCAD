# cargo-deny configuration: the supply-chain gate behind aggressive automerge.
# A dependency bump can only merge itself if it stays clean here.

[graph]
# Check the platforms we ship.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" notices only fail for our direct
# dependencies: deep GPUI transitive crates (font shaping etc.) often have no
# maintained drop-in yet, and we cannot act on them beyond bumping GPUI.
unmaintained = "workspace"

[licenses]
version = 2
# Permissive (and weak, file-level copyleft MPL-2.0) licenses only; anything
# else blocks the merge until reviewed.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "ISC",
  "0BSD",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
